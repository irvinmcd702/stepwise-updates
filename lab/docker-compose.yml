name: stepwise-lab

# PHP_VERSION comes from lab/php-version; the tool and seed.sh pass it in.
x-db-env: &db-env
  WORDPRESS_DB_HOST: db
  WORDPRESS_DB_NAME: wordpress
  WORDPRESS_DB_USER: wordpress
  WORDPRESS_DB_PASSWORD: ${DB_PASSWORD}
  WORDPRESS_DEBUG: "1"
  WORDPRESS_CONFIG_EXTRA: |
    define( 'WP_DEBUG_LOG', '/logs/debug.log' );
    define( 'WP_DEBUG_DISPLAY', false );
    define( 'AUTOMATIC_UPDATER_DISABLED', true );

services:
  db:
    image: mariadb:11
    command: --innodb-use-native-aio=0
    environment:
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wordpress
      MARIADB_PASSWORD: ${DB_PASSWORD}
      MARIADB_RANDOM_ROOT_PASSWORD: "1"
    volumes:
      - db_data:/var/lib/mysql

  wordpress:
    image: wordpress:php${PHP_VERSION:-7.4}-apache
    depends_on: [db]
    ports:
      - "127.0.0.1:8095:80"
    environment: *db-env
    volumes:
      - wp_data:/var/www/html
      - ./logs:/logs

  cli:
    image: wordpress:cli-php${PHP_VERSION:-7.4}
    profiles: [tools]
    depends_on: [db, wordpress]
    user: "33:33"
    environment:
      <<: *db-env
      HOME: /tmp
    volumes:
      - wp_data:/var/www/html
      - ./logs:/logs
      - ./backups:/backups
      - ./content:/content:ro
      - ./theme:/theme:ro
      - ./plugins:/plugins:ro
      - ./mu:/mu:ro
      - ./updates:/updates:ro
      - ./fixes:/fixes:ro

volumes:
  db_data:
  wp_data:
